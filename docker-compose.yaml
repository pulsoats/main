services:
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    env_file: .env
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=${POSTGRES_DSN}
      - up
    restart: "no"

  vault-agent:
    image: hashicorp/vault:latest
    # Записывает role-id/secret-id из env в файлы, затем запускает агент
    entrypoint:
      - sh
      - -c
      - |
        printf '%s' "$$VAULT_ROLE_ID"   > /vault/auth/role-id
        printf '%s' "$$VAULT_SECRET_ID" > /vault/auth/secret-id
        exec vault agent -config=/vault/config/agent.hcl
    environment:
      VAULT_ADDR:      ${VAULT_ADDR}
      VAULT_ROLE_ID:   ${VAULT_ROLE_ID}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID}
    volumes:
      - ./vault/config:/vault/config:ro
      - vault_auth:/vault/auth
      - certs:/run/certs
    healthcheck:
      # Готов, когда все три файла записаны
      test: ["CMD", "sh", "-c", "test -s /run/certs/cert.pem && test -s /run/certs/key.pem && test -s /run/certs/ca.pem"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  main:
    build:
      context: .
      secrets:
        - github_token
    env_file: .env
    ports:
      - "${HTTP_ADDR:-8080}:8080"
    volumes:
      - certs:/run/certs:ro
    depends_on:
      vault-agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vault_auth:
  certs:

secrets:
  github_token:
    environment: GITHUB_TOKEN
