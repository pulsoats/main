services:
  main:
    build:
      context: .
      secrets:
        - github_token
    container_name: pulsoats-main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate-main:
        condition: service_completed_successfully
      migrate-analysis:
        condition: service_completed_successfully
      analysis:
        condition: service_started
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    volumes:
      - ${CERTS_DIR:-./certs}:/run/certs:ro
