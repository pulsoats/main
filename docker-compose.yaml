services:
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    env_file: .env
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=${POSTGRES_DSN}
      - up
    restart: "no"

  main:
    build:
      context: .
      secrets:
        - github_token
    env_file: .env
    environment:
      GRPC_TLS_DISABLE: "true"
    ports:
      - "${HTTP_ADDR:-8080}:8080"
    restart: unless-stopped

secrets:
  github_token:
    environment: GITHUB_TOKEN
